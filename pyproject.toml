[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-ai-chatbot"
version = "1.0.0"
description = "基于 LangChain 的终端 AI 聊天助手（支持 OpenAI 兼容接口与 Ollama 本地模型）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["langchain", "chatbot", "llm", "cli", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # LangChain 1.x 稳定线；对话统一走 LangGraph（1.x 已弃用 RunnableWithMessageHistory）
    "langchain>=1.4.0,<2.0.0",
    "langchain-core>=1.6.0,<2.0.0",
    # LangChain 1.x：被移除的旧 API（如 CacheBackedEmbeddings）由 langchain-classic 提供
    "langchain-classic>=1.0.0,<2.0.0",
    "langchain-openai>=1.6.0,<2.0.0",
    "langchain-community>=0.4.0,<0.5.0",
    "langgraph>=1.2.0,<1.3.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    # RAG（文档解析 / Milvus 向量库 / Redis 嵌入缓存 / BM25 混合检索）
    "langchain-milvus>=0.4.0,<0.5.0",
    "pymilvus>=3.0.0,<4.0.0",
    "requests>=2.31.0",
    "redis>=5.0.0",
    "rank_bm25>=0.2.2",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

# 安装后可全局使用 `ai-chat` 命令启动
[project.scripts]
ai-chat = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app", "rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
